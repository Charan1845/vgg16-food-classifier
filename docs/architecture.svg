<svg width="680" height="770" viewBox="0 0 680 770" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>VGG16 transfer-learning architecture for Food-101 classification</title>
  <desc>Input image flows through the pretrained VGG16 convolutional base (blocks 1-4 frozen, block 5 fine-tuned), then into a custom head: global average pooling, a sigmoid dense layer, dropout, and a final softmax dense layer producing class probabilities.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="770" fill="#000000"/>

  <rect x="210" y="40" width="260" height="44" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#D3D1C7">Input image · 224×224×3</text>
  <line x1="340" y1="84" x2="340" y2="120" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="120" width="400" height="220" rx="16" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="340" y="142" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#CECBF6">VGG16 convolutional base</text>
  <text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#AFA9EC">ImageNet-pretrained, partially frozen</text>

  <rect x="160" y="168" width="360" height="28" rx="6" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="340" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">Block 1 · 64 filters · 112×112</text>

  <rect x="160" y="202" width="360" height="28" rx="6" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="340" y="216" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">Block 2 · 128 filters · 56×56</text>

  <rect x="160" y="236" width="360" height="28" rx="6" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="340" y="250" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">Block 3 · 256 filters · 28×28</text>

  <rect x="160" y="270" width="360" height="28" rx="6" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="340" y="284" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">Block 4 · 512 filters · 14×14</text>

  <rect x="160" y="304" width="360" height="28" rx="6" fill="#712B13" stroke="#F0997B" stroke-width="1"/>
  <text x="340" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F5C4B3">Block 5 (fine-tuned) · 512 filters · 7×7</text>

  <line x1="340" y1="340" x2="340" y2="380" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="210" y="380" width="260" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="398" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#D3D1C7">Global average pooling</text>
  <text x="340" y="416" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B4B2A9">7×7×512 → 512-d vector</text>

  <line x1="340" y1="436" x2="340" y2="476" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="210" y="476" width="260" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="340" y="494" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#9FE1CB">Dense 256 · Sigmoid</text>
  <text x="340" y="512" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">learned feature mix</text>

  <line x1="340" y1="532" x2="340" y2="572" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="210" y="572" width="260" height="44" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="594" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#D3D1C7">Dropout 0.5</text>

  <line x1="340" y1="616" x2="340" y2="656" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="210" y="656" width="260" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="340" y="674" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#9FE1CB">Dense 17 · Softmax</text>
  <text x="340" y="692" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">17-class probabilities</text>

  <text x="140" y="730" font-size="12" fill="#B4B2A9">Blue = frozen (ImageNet)   Coral = fine-tuned (block 5)</text>
  <text x="140" y="748" font-size="12" fill="#B4B2A9">Gray = structural ops   Teal = trainable head</text>
</svg>
